[project]
name = "dead-internet-investigation"
version = "0.1.0"
description = "A reproducible, bounded provenance study of Google AI Overviews' pizza-glue incident."
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "networkx>=3.2", "scikit-learn>=1.4"]

[project.optional-dependencies]
collect = ["httpx>=0.27", "beautifulsoup4>=4.12", "trafilatura>=1.8"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
